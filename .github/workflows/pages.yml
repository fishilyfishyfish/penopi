name: Test and deploy to Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # 24.04: Playwright 1.56.1 has no Chromium build for ubuntu-latest (26.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # stable installs wasm-bindgen-cli; backgammon has its own pinned toolchain (backgammon/rust-toolchain.toml),
      # which rustup installs on first use.
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          (cd backgammon && rustup show active-toolchain || rustup toolchain install)

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backgammon/engine/target
          key: cargo-${{ runner.os }}-${{ hashFiles('*/engine/Cargo.lock', 'backgammon/rust-toolchain.toml') }}

      # must match wasm-bindgen in both engines' Cargo.lock
      - uses: actions/cache@v4
        id: wb-cache
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-${{ runner.os }}-0.2.129
      - name: Install wasm-bindgen-cli
        if: steps.wb-cache.outputs.cache-hit != 'true'
        run: cargo +stable install wasm-bindgen-cli --version 0.2.129 --locked

      - name: Test engines
        run: |
          (cd backgammon/engine && cargo test --release --locked)

      - name: Lines fit the font
        run: |
          pip install --quiet fonttools brotli
          python3 tools/check-lines.py

      - name: Build WASM
        run: ./tools/build-wasm.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # rules (vs a naive implementation), forced-win search (vs a plain solver), strength (vs random/greedy)
      - name: Test Breakthrough engine
        run: node tools/test-breakthrough.mjs

      # perft vs published values, every move vs a naive implementation, the capture rules by hand, strength
      - name: Test draughts engine
        run: node tools/test-draughts.mjs

      # perft on the standard test positions, rules and draws, forced mates, strength
      - name: Test chess engine
        run: node tools/test-chess.mjs

      # win detection vs a naive counter under all three rules, forbidden shapes by hand, five/block/VCF, strength
      - name: Test gomoku engine
        run: node tools/test-gomoku.mjs

      # every move of random games vs a naive implementation, mill/flying/loss rules by hand, strength
      - name: Test Nine Men's Morris engine
        run: node tools/test-morris.mjs

      # every move of random games vs a naive implementation, captures/grand slam/feeding by hand, endings vs a solver, strength
      - name: Test oware engine
        run: node tools/test-oware.mjs

      # perft vs published counts, every move of random games vs a naive implementation, exact endings vs an exhaustive search, strength
      - name: Test Reversi engine
        run: node tools/test-reversi.mjs

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.56.1
      # plays every game in Chromium for a while (tools/smoke.mjs)
      - name: Smoke test
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
          node tools/smoke.mjs 6
          rm -rf node_modules

      # the site: everything but the engine sources and tools, plus the list of files for offline use (sw.js)
      - name: Assemble site
        run: python3 tools/assemble.py _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
