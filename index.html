<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>페노피</title>
<meta name="description" content="판 위로 고개를 내민 낙서 페노피와 두는 보드게임 모음">
<meta name="theme-color" content="#f7f6f1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="shared/fonts/Gaegu-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="shared/fonts/Gaegu-Bold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="shared/paper.css">
<style>
/* the lobby: Penopi peeking over a sheet of game cards */
.title { font-size: 26px; font-weight: 700; margin: 0; }
.shelf { position: relative; z-index: 1; width: var(--size); max-width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 16px; background: var(--sheet); border: 2.8px solid var(--ink); border-radius: 6px 14px 8px 12px / 12px 6px 14px 8px; }
.card { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; padding: 10px 8px 12px; min-width: 0; color: var(--ink); text-decoration: none; background: var(--sheet); border: 2.6px solid var(--ink); border-radius: var(--hand); box-shadow: 3px 4px 0 var(--ink); transition: transform .1s, box-shadow .1s; }
.card:nth-child(2n) { border-radius: 15px 225px 15px 255px / 255px 15px 225px 15px; }
.card:hover { transform: translate(-1px, -1px) rotate(-.6deg); box-shadow: 4px 5px 0 var(--ink); }
.card:active { transform: translate(2px, 3px); box-shadow: 1px 1px 0 var(--ink); }
.card:focus-visible { outline: 2.6px dashed var(--pen); outline-offset: 5px; }
.card img { width: 72px; height: 72px; display: block; }
.card h2 { margin: 2px 0 0; font-size: 22px; line-height: 1.1; word-break: keep-all; }
.card p { margin: 2px 0 0; font-size: 16px; line-height: 1.25; word-break: keep-all; }
.card .rec { color: var(--muted); font-size: 15px; }
/* narrow screens: two small cards a row, name and record only (pointing at a card, Penopi says what it is) */
@media (max-width: 560px) { .card .blurb { display: none; } .shelf { gap: 12px; padding: 12px; } }
.foot { width: var(--size); max-width: 100%; color: var(--muted); font-size: 15px; text-align: center; margin: 0; }
.stage { justify-content: flex-start; padding-top: max(16px, 4vh); }
</style>
</head>
<body>
<main class="stage" id="stage">
  <div class="bar"><h1 class="title">페노피의 보드게임</h1></div>
  <!-- perch: filled by lobby.js -->
  <nav class="shelf" id="shelf" aria-label="게임 목록"></nav>
  <p class="foot">한 번 열어 둔 게임은 인터넷이 없어도 열려요.</p>
</main>
<script type="module" src="lobby.js"></script>
</body>
</html>
